# APIM 4.7 ELK guide, Step 2 "Installing Logstash" pipeline, verbatim except
# hosts/credentials (from env) and the ES 9 endpoint.
input {
    beats {
        port => 5044
    }
}

filter {
    grok {
        match => ["message", "%{GREEDYDATA:UNWANTED}\ apimMetrics:%{GREEDYDATA:apimMetrics}\, %{GREEDYDATA:UNWANTED} \:%{GREEDYDATA:properties}"]
    }
    json {
        source => "properties"
    }
}
output {
    if [apimMetrics] == " apim:response" {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "apim_event_response"
            user => "elastic"
            password => "${ELASTIC_PASSWORD}"
        }
    } else if [apimMetrics] == " apim:faulty" {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "apim_event_faulty"
            user => "elastic"
            password => "${ELASTIC_PASSWORD}"
        }
    }
}
